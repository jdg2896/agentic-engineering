# Source of truth for the agentic-engineering resource guide.
# Edit this file and run `uv run python scripts/render.py` to update README.md.
#
# Schema: see docs/specs/self-maintaining-guide/SPEC.md §3.1.
# T1 scope: sections 1 (foundations) + 2 (tools-mcp) populated.
# Resources for sections 3-14 are migrated in T2; the two `hidden: true`
# entries below exist only so the top-7 list can resolve their slugs in T1.

sections:
  - id: foundations
    order: 1
    title: 'Foundational design & "what is an agent"'
    description: |
      Mental models for what an agent is, when to build one vs. a workflow,
      context engineering, and the canonical "agents are mostly software"
      doctrine. Read this first.
  - id: tools-mcp
    order: 2
    title: "Tool integration & MCP"
    description: |
      Model Context Protocol spec, architecture, and ecosystem tooling —
      official reference servers, community registries, the agent-to-tool
      surface area, and the emerging A2A agent-to-agent protocol.
  - id: multi-agent-frameworks
    order: 3
    title: "Multi-agent orchestration frameworks"
    description: |
      Runtime libraries and graph-based orchestration frameworks for building
      multi-agent systems in Python and TypeScript — LangGraph, OpenAI Agents
      SDK, Microsoft Agent Framework, Google ADK, CrewAI, Pydantic AI, and the
      lighter-weight TS options.
  - id: durable-execution
    order: 4
    title: "Durable execution for agents"
    description: |
      Workflow engines and durable-execution runtimes that bring fault-tolerance,
      retries, and human-in-the-loop checkpointing to long-running agent loops —
      Temporal, Inngest, Restate, Hatchet, DBOS.
  - id: memory-systems
    order: 5
    title: "Memory systems"
    description: |
      Approaches to giving agents persistent, tiered memory — from simple
      file-backed tools to bi-temporal knowledge graphs and full
      MemGPT-lineage runtimes (Letta, Mem0, Zep/Graphiti, LangMem).
  - id: sandboxing
    order: 6
    title: "Sandboxing & code execution"
    description: |
      Secure execution environments for code-executing agents — Firecracker
      microVMs, gVisor user-space kernels, Cloudflare Containers, native macOS
      containers, sub-millisecond WASM micro-sandboxes, and the trade-offs
      between them.
  - id: inference-gateway
    order: 7
    title: "Inference & gateway infrastructure"
    description: |
      Self-hosted inference servers (vLLM, SGLang, TGI), multi-provider gateway
      proxies (LiteLLM, Portkey, OpenRouter), and prompt-caching docs — the
      infrastructure layer between your agent and the model.
  - id: eval-philosophy
    order: 8
    title: "Evaluation — philosophy (read these first)"
    description: |
      Foundational thinking on how to build evaluation loops, why vibes-based
      iteration fails, and the principles behind LLM-as-judge graders. The
      "stop vibe-checking, start measuring" canon plus the academic backing.
  - id: eval-frameworks
    order: 9
    title: "Evaluation — frameworks & benchmarks"
    description: |
      Frameworks and benchmarks for running agent evals — Inspect AI, OpenAI
      Evals, Promptfoo, DeepEval, Ragas, the SaaS platforms (LangSmith,
      Braintrust, Phoenix, Langfuse, Patronus), and the canonical agentic task
      benchmarks (SWE-bench, GAIA, τ-bench, WebArena, OSWorld).
  - id: observability
    order: 10
    title: "Observability & tracing"
    description: |
      OpenTelemetry GenAI semantic conventions and the tooling built on them —
      OpenLLMetry, Langfuse, Phoenix, LangSmith, Helicone, Honeycomb, Datadog —
      for tracing, logging, and monitoring LLM calls and agent spans.
  - id: production-testing
    order: 11
    title: "Production testing patterns & cost/latency"
    description: |
      CI integration for eval gates, production trace sampling back into eval
      datasets (the data flywheel), and per-trace/per-user/per-prompt cost and
      latency attribution.
  - id: security
    order: 12
    title: "Security for agents"
    description: |
      Threat models, vulnerability taxonomies (OWASP LLM Top 10, MITRE ATLAS),
      published defense patterns (CaMeL, dual-LLM), and concrete prompt-injection
      and RCE write-ups for agents.
  - id: coding-agent-infra
    order: 13
    title: "Coding agent infrastructure (read for harness design even if not building one)"
    description: |
      Harness design, hook systems, tool allowlists, and operational patterns
      for building and running coding agents — Claude Code best practices, the
      Claude Agent SDK, Cognition's Devin learnings, Aider, Sourcegraph Amp,
      and the Ralph Wiggum loop.
  - id: sre-ops-patterns
    order: 14
    title: "SRE & operations agents (K8s, observability, IaC)"
    description: |
      Agents that operate production systems: SRE, Kubernetes, observability,
      IaC, and incident response — k8sgpt, HolmesGPT, Datadog Bits AI SRE,
      Honeycomb's observability agent, Terraform's MCP server, and the
      canonical multi-agent research-system case study.

