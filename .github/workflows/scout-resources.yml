name: Scout resources

on:
  schedule:
    - cron: '0 13 * * 4'   # Thursdays 13:00 UTC
  workflow_dispatch:
    inputs:
      candidate_cap:
        description: 'Auto-merge candidate cap for this run only (e.g. raise it for a catch-up run)'
        type: number
        default: 8

permissions:
  contents: write
  pull-requests: write

jobs:
  check-pause:
    runs-on: ubuntu-latest
    outputs:
      paused: ${{ steps.check.outputs.paused }}
    steps:
      - id: check
        run: |
          if [ "${{ vars.MAINTENANCE_PAUSED }}" = "true" ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Maintenance paused — skipping scout."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

  scout:
    needs: check-pause
    if: needs.check-pause.outputs.paused != 'true'
    runs-on: ubuntu-latest
    # Normal runs take ~1.5 min; this bounds a run stuck in judge retries.
    timeout-minutes: 90
    steps:
      # Scout's judge runs on Claude Code headless with the subscription OAuth token
      # (docs/adr/0001-oauth-token-for-ci.md). The token is scoped to the steps that
      # need it so third-party actions in this job never see it.
      - name: Check Claude Code OAuth token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is empty or missing. Run \`claude setup-token\` locally and save the token as the CLAUDE_CODE_OAUTH_TOKEN repo secret. The token expires after one year and must be rotated (docs/adr/0001-oauth-token-for-ci.md)."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # No cache: a privileged job must not restore a cache writable by less-trusted runs.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false

      - run: uv sync --frozen

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        # Pinned: scripts/judge.py's CLI flags and JSON envelope were verified against 2.1.283.
        run: npm install -g @anthropic-ai/claude-code@2.1.283

      # Fails closed: a judge error that survives judge.py's retries (auth
      # errors are never retried) exits non-zero with no files written, so the
      # job goes red and no PR opens. Unbuffered so progress logs stream live.
      - name: Run scout
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: uv run python scripts/scout.py

      # Auto-merge gate (ADR-0002): pure circuit-breakers in scout.py. Runs
      # before candidates are appended so it sees the pre-run section ids.
      # A dispatched candidate_cap (default 8) is passed through as given, 0
      # included. Scheduled runs have no inputs, so --cap is omitted and
      # scout.py's own default of 8 applies.
      - name: Evaluate auto-merge gate
        env:
          CANDIDATE_CAP: ${{ inputs.candidate_cap }}
        run: |
          uv run python scripts/scout.py --automerge-decision candidates.yaml \
            ${CANDIDATE_CAP:+--cap "$CANDIDATE_CAP"} \
            > "$RUNNER_TEMP/automerge_decision.json"
          cat "$RUNNER_TEMP/automerge_decision.json"

      - name: Compute metadata and append candidates
        id: meta
        run: |
          uv run python3 - <<'EOF'
          import json
          import os
          import secrets
          import sys
          from datetime import datetime, date, timezone
          from pathlib import Path

          from ruamel.yaml import YAML

          sys.path.insert(0, "scripts")
          import scout

          year_week = datetime.now(timezone.utc).strftime("%Y-W%V")
          decision = json.loads(Path(os.environ["RUNNER_TEMP"], "automerge_decision.json").read_text())
          candidates = scout.load_candidates(Path("candidates.yaml"))

          n = len(candidates)

          if n > 0:
              title = f"Scout — {year_week} — {n} candidate{'s' if n != 1 else ''}"

              # Append candidates to resources.yaml (never touches top_7)
              ryaml = YAML()
              ryaml.preserve_quotes = True
              ryaml.default_flow_style = False
              ryaml.indent(mapping=2, sequence=4, offset=2)
              ryaml.representer.add_representer(
                  type(None),
                  lambda dumper, data: dumper.represent_scalar("tag:yaml.org,2002:null", "null"),
              )

              with open("resources.yaml") as f:
                  res_data = ryaml.load(f)

              scout.append_candidates(res_data, candidates, date.today().isoformat())

              with open("resources.yaml", "w") as f:
                  ryaml.dump(res_data, f)

              rows = []
              for c in candidates:
                  rows.append(
                      f"- [ ] **[{c['title']}]({c['url']})** — `{c['section']}` · `{c['type']}`\n"
                      f"      Source: `{c['source_id']}` | Proposed slug: `{c['slug']}`\n"
                      f"      Blurb: _{c['blurb']}_\n"
                      f"      Rationale: _{c['rationale']}_"
                  )

              body = f"## Candidates ({n})\n\n" + "\n\n".join(rows)
          else:
              title = f"Scout bookkeeping — {year_week} (no candidates)"
              body = "_No new candidates this week. seen.yaml records the rejects; last\\_checked\\_at is bumped only on Sources whose feed was fetched and whose new entries were all judged._"

          if decision["auto_merge_ok"]:
              prefix = "> **Auto-merge enabled** — this PR will land once required checks pass.\n"
          else:
              prefix = "> **Auto-merge skipped:** " + "; ".join(decision["reasons"]) + ".\n"
          body = prefix + "\n" + body

          env_file = os.environ["GITHUB_ENV"]
          # Random delimiter: a body line equal to a fixed one could inject env vars (e.g. AUTO_MERGE_OK).
          delim = secrets.token_hex(16)
          with open(env_file, "a") as f:
              f.write(f"YEAR_WEEK={year_week}\n")
              f.write(f"SCOUT_N={n}\n")
              f.write(f"SCOUT_TITLE={title}\n")
              f.write(f"AUTO_MERGE_OK={'true' if decision['auto_merge_ok'] else 'false'}\n")
              f.write(f"SCOUT_LABELS={','.join(decision['labels'])}\n")
              f.write(f"SCOUT_PR_BODY<<{delim}\n")
              f.write(body + "\n")
              f.write(f"{delim}\n")
          EOF

      # Always re-render: bot PRs never trigger the render gate, so this keeps README.md in sync.
      - name: Re-render guide
        run: uv run python scripts/render.py

      # Fixed branch: an open Scout PR is updated in place instead of stacking.
      - id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: bot/scout
          title: ${{ env.SCOUT_TITLE }}
          body: ${{ env.SCOUT_PR_BODY }}
          commit-message: "chore(scout): weekly resource scout ${{ env.YEAR_WEEK }}"
          labels: ${{ env.SCOUT_LABELS }}

      # Labels are additive on an updated PR, so clear a hold left by an earlier run.
      - name: Enable auto-merge on routine PR
        if: env.AUTO_MERGE_OK == 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ steps.cpr.outputs.pull-request-number }}" --remove-label auto-merge-skipped || true
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --auto --squash

      # The auto-merge-skipped label comes from the gate's labels above; also turn
      # off auto-merge an earlier clean run may have enabled on this same PR.
      - name: Hold PR for review
        if: env.AUTO_MERGE_OK != 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ steps.cpr.outputs.pull-request-number }}" --add-label auto-merge-skipped || true
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --disable-auto || true
