name: Render gate

# WARNING: this workflow executes PR code (`uv sync` and scripts/render.py from the
# PR head), so it runs on plain `pull_request`: fork PRs get a read-only token, no
# secrets and an isolated cache scope. Never switch it back to pull_request_target;
# that would run fork code with secrets and the base branch's cache, which the
# privileged scout/verify workflows restore. Bot PRs never trigger this gate either
# way (GITHUB_TOKEN-created PRs start no workflows); the bots re-render themselves.
on:
  pull_request:

permissions:
  contents: read

jobs:
  render-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect render-relevant changes
        id: changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD \
              | grep -qE '^(resources\.yaml|templates/|scripts/render\.py|pyproject\.toml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No render-relevant files changed — skipping render check."
          fi

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        if: steps.changes.outputs.changed == 'true'

      - run: uv sync --frozen
        if: steps.changes.outputs.changed == 'true'

      - run: uv run python scripts/render.py
        if: steps.changes.outputs.changed == 'true'

      - name: Fail if rendered output is out of sync
        if: steps.changes.outputs.changed == 'true'
        run: git diff --exit-code README.md
