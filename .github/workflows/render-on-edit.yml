name: Render gate

on:
  pull_request:
    paths:
      - resources.yaml
      - templates/**
      - scripts/render.py
      - pyproject.toml

permissions:
  contents: read

jobs:
  render-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv sync --frozen

      - run: uv run python scripts/render.py

      - name: Fail if rendered output is out of sync
        run: git diff --exit-code agentic-engineering.md
