name: Render gate

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  render-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect render-relevant changes
        id: changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD \
              | grep -qE '^(resources\.yaml|templates/|scripts/render\.py|pyproject\.toml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No render-relevant files changed — skipping render check."
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.changes.outputs.changed == 'true'

      - run: uv sync --frozen
        if: steps.changes.outputs.changed == 'true'

      - run: uv run python scripts/render.py
        if: steps.changes.outputs.changed == 'true'

      - name: Fail if rendered output is out of sync
        if: steps.changes.outputs.changed == 'true'
        run: git diff --exit-code agentic-engineering.md
