name: CI

# Runs the test suite and the linter on every PR to main and every push to main.
#
# Runs PR code, so it uses plain `pull_request` (never pull_request_target): fork
# PRs get a read-only token, no secrets and an isolated cache scope. No secrets are
# used here; the tests stub the judge and never call the real `claude` CLI.
#
# LIMITATION: PRs opened with the default GITHUB_TOKEN (the Scout, Verify links and
# Source review bots, via peter-evans/create-pull-request) do NOT trigger workflows;
# GitHub suppresses them to prevent recursive runs. Bot PRs therefore get no CI
# check unless those workflows open PRs with a PAT or GitHub App token instead.
# Their merges to main still run this workflow via the `push` trigger. Making this
# a required status check is left to the maintainer: if required, bot PRs would
# wait forever on a check that never starts.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Run ruff
        run: uv run ruff check .
