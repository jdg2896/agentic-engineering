name: CI

# Runs the test suite and the linter on every PR to main and every push to main.
#
# Runs PR code, so it uses plain `pull_request` (never pull_request_target): fork
# PRs get a read-only token, no secrets and an isolated cache scope. No secrets are
# used here; the tests stub the judge and never call the real `claude` CLI.
#
# BOT PRs: the Scout, Verify links and Source review bots open PRs with the default
# GITHUB_TOKEN (via peter-evans/create-pull-request) and auto-merge + delete the
# branch within seconds. The pull_request run is orphaned before it can check out
# the (now-gone) head commit, so GitHub marks it a startup failure ("This run likely
# failed because of a workflow file issue") — persistent red-X noise, not a real
# failure. The `test` job below is therefore skipped for `bot/**` head branches; a
# skipped job resolves cleanly instead of failing. Push-to-main runs still execute
# (head_ref is empty on push), so a bot merge to main is re-checked here.
#
# If this check is made required, a non-bot PR still blocks on it as normal.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Skip for bot PRs (they auto-merge + delete their branch, orphaning the run);
    # push-to-main runs still execute because head_ref is empty on push events.
    if: ${{ !startsWith(github.head_ref, 'bot/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Run ruff
        run: uv run ruff check .
