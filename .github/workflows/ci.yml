name: CI

# Runs the test suite and the linter on every PR to main and every push to main.
#
# Runs PR code, so it uses plain `pull_request` (never pull_request_target): fork
# PRs get a read-only token, no secrets and an isolated cache scope. No secrets are
# used here; the tests stub the judge and never call the real `claude` CLI.
#
# LIMITATION (bot PRs): the Scout, Verify links and Source review bots open PRs
# with the default GITHUB_TOKEN (via peter-evans/create-pull-request). Bot PRs
# opened with GITHUB_TOKEN get CI runs, but they wait for a maintainer to approve
# them ("Approve workflows to run"). Bot auto-merges (also GITHUB_TOKEN) trigger
# no push runs, so a bot merge to main is not re-checked here. If this check is
# made required, a bot PR blocks until someone approves the run, unless the bots
# switch to an App or PAT token. Making it required is left to the maintainer.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Run ruff
        run: uv run ruff check .
