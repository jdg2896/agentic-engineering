name: Source review

on:
  schedule:
    - cron: '0 13 1 * *'   # 1st of each month, 13:00 UTC
  workflow_dispatch:

jobs:
  check-pause:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      paused: ${{ steps.check.outputs.paused }}
    steps:
      - id: check
        run: |
          if [ "${{ vars.MAINTENANCE_PAUSED }}" = "true" ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Maintenance paused — skipping Source review."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

  source-review:
    needs: check-pause
    if: needs.check-pause.outputs.paused != 'true'
    runs-on: ubuntu-latest
    # Like Scout. source_review.py stops Citation mining after 20 minutes (and 200
    # Resource pages), then stops starting Trials after 35 minutes (and at 10 Trials),
    # so the PR steps always get to run well inside this.
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: read   # Source suggestions
    outputs:
      close-suggestions: ${{ steps.meta.outputs.close_suggestions }}
    steps:
      # Trials run the Scout judge on Claude Code headless with the subscription OAuth
      # token (docs/adr/0001-oauth-token-for-ci.md). The token is scoped to the steps
      # that need it so third-party actions in this job never see it.
      - name: Check Claude Code OAuth token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is empty or missing. Run \`claude setup-token\` locally and save the token as the CLAUDE_CODE_OAUTH_TOKEN repo secret. The token expires after one year and must be rotated (docs/adr/0001-oauth-token-for-ci.md)."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # No cache: a privileged job must not restore a cache writable by less-trusted runs.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false

      - run: uv sync --frozen

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        # Pinned: scripts/judge.py's CLI flags and JSON envelope were verified against 2.1.283.
        run: npm install -g @anthropic-ai/claude-code@2.1.283

      # Open issues labelled source-suggestion, as raw JSON in a file: issue bodies are
      # untrusted (public repo), so none of it touches the shell or GITHUB_ENV.
      # source_review.py keeps only the owner's and collaborators' issues and reads
      # nothing from a body but its first http(s) url. A missing label lists no issues;
      # if the listing itself fails, the review still runs, without suggestions.
      - name: Fetch Source suggestions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT: ${{ runner.temp }}/source_suggestions.json
        run: |
          if ! gh api --method GET "repos/$GITHUB_REPOSITORY/issues" \
              -f labels=source-suggestion -f state=open -f per_page=100 > "$OUT"; then
            echo "::warning::Could not list Source suggestions; reviewing without them."
            echo '[]' > "$OUT"
          fi

      # Plans the review (Trials call the judge, so this step alone gets the OAuth
      # token), evaluates the auto-merge gate (ADR 0002) against the pre-plan Source
      # list, then applies the plan to sources.yaml and scout/prospects.yaml (the
      # Prospective Source memory). Writes the PR title/body/labels outside the
      # checkout so they are never committed. A judge error, usage limit or spent
      # Trial budget stops Trials but not this step: retirements and finished Trials
      # still land and the PR body says the run was partial. A judge error then fails
      # the job in the last step, after the PR steps.
      - name: Run Source review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: >-
          uv run python scripts/source_review.py
          --suggestions "$RUNNER_TEMP/source_suggestions.json"
          --summary "$RUNNER_TEMP/source_review.json"

      - name: Compute PR metadata
        id: meta
        run: |
          uv run python3 - <<'EOF'
          import json
          import os
          import secrets
          from datetime import datetime, timezone
          from pathlib import Path

          summary = json.loads(Path(os.environ["RUNNER_TEMP"], "source_review.json").read_text())
          # Decided Source suggestions for the close-decided-suggestions job, as one
          # JSON line: only int issue numbers and source_review.py's fixed comments.
          closes = [
              {"number": c["number"], "comment": str(c["comment"])}
              for c in summary.get("close_suggestions", [])
              if type(c.get("number")) is int and c["number"] > 0
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"close_suggestions={json.dumps(closes)}\n")
          env_file = os.environ["GITHUB_ENV"]
          with open(env_file, "a") as f:
              f.write(f"YEAR_MONTH={datetime.now(timezone.utc):%Y-%m}\n")
              f.write(f"PLAN_EMPTY={'true' if summary['empty'] else 'false'}\n")
              f.write(f"RUN_INCOMPLETE={'true' if summary['incomplete'] else 'false'}\n")
              f.write(f"JUDGE_FAILED={'true' if summary['judge_failed'] else 'false'}\n")
              if not summary["empty"]:
                  # Title, body and labels are built and sanitized in source_review.py.
                  # Random delimiter: a body line equal to a fixed one could inject env vars (e.g. AUTO_MERGE_OK).
                  delim = secrets.token_hex(16)
                  f.write(f"REVIEW_TITLE={summary['title']}\n")
                  f.write(f"AUTO_MERGE_OK={'true' if summary['auto_merge_ok'] else 'false'}\n")
                  f.write(f"REVIEW_LABELS={','.join(summary['labels'])}\n")
                  f.write(f"REVIEW_PR_BODY<<{delim}\n")
                  f.write(summary["body"] + "\n")
                  f.write(f"{delim}\n")
          EOF

      # Nothing to add, retire or reject: no new PR (nothing was written), and an
      # earlier held Source review PR is now stale evidence, so close it rather than
      # leave it mergeable. No-op when there is none. Not after a partial run: Trials
      # that did not run decided nothing, so an open PR is not shown to be stale.
      - name: Close superseded Source review PR
        if: env.PLAN_EMPTY == 'true' && env.RUN_INCOMPLETE != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT: "Superseded: the ${{ env.YEAR_MONTH }} Source review planned no changes."
        run: gh pr close bot/source-review --delete-branch --comment "$COMMENT" || true

      # Re-render: bot PRs never trigger the render gate, and Worth following is
      # derived from sources.yaml, so an addition or retirement changes README.md too.
      - name: Re-render guide
        if: env.PLAN_EMPTY != 'true'
        run: uv run python scripts/render.py

      # Fixed branch: an open Source review PR is updated in place instead of stacking.
      - id: cpr
        if: env.PLAN_EMPTY != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: bot/source-review
          title: ${{ env.REVIEW_TITLE }}
          body: ${{ env.REVIEW_PR_BODY }}
          commit-message: "chore(source-review): monthly Source review ${{ env.YEAR_MONTH }}"
          labels: ${{ env.REVIEW_LABELS }}
          # Only the files Source review writes, plus the README it re-renders.
          add-paths: |
            sources.yaml
            scout/prospects.yaml
            README.md

      # Labels are additive on an updated PR, so clear a hold left by an earlier run.
      - name: Enable auto-merge (gate passed)
        if: env.PLAN_EMPTY != 'true' && env.AUTO_MERGE_OK == 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh pr edit "$PR" --remove-label auto-merge-skipped || true
          gh pr merge "$PR" --auto --squash

      # The auto-merge-skipped label comes from the gate's labels above; also turn
      # off auto-merge an earlier clean run may have enabled on this same PR.
      - name: Hold for review (gate failed)
        if: env.PLAN_EMPTY != 'true' && env.AUTO_MERGE_OK != 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh pr edit "$PR" --add-label auto-merge-skipped || true
          gh pr merge "$PR" --disable-auto || true

      # A judge error must not look like a quiet month: after the PR steps (so
      # retirements and decided work still land), fail the job with what to do. A
      # usage limit is not a failure and stays a green warning.
      - name: Fail on judge error
        if: always() && env.JUDGE_FAILED == 'true'
        run: |
          uv run python3 - <<'EOF'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import scout

          summary = json.loads(Path(os.environ["RUNNER_TEMP"], "source_review.json").read_text())
          hint = scout.sanitize_text(summary.get("judge_failure_hint") or "")
          print(f"::error::A judge error stopped Source review's Trials. {hint}")
          sys.exit(1)
          EOF

  # Closes the Source suggestions whose decision (an Addition or a Rejection) already
  # landed on main through an earlier Source review PR. That PR's `Closes #n` lines are
  # best effort only: it is opened and auto-merged with GITHUB_TOKEN, GitHub recorded no
  # closing reference for PR #132 (#131 stayed open), and a merge caused by GITHUB_TOKEN
  # creates no workflow run, so no `pull_request: closed` / `push` workflow can do it (#136).
  # A separate job, so only it holds `issues: write`. It runs even when the review job
  # went red on a judge error after writing its summary.
  close-decided-suggestions:
    needs: source-review
    # Only on main: a dispatch on another branch reads that branch's decisions.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.source-review.outputs.close-suggestions != '' &&
      needs.source-review.outputs.close-suggestions != '[]'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close decided Source suggestions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOSES: ${{ needs.source-review.outputs.close-suggestions }}
        run: |
          jq -c '.[]' <<< "$CLOSES" | while read -r close; do
            number=$(jq -r '.number' <<< "$close")
            [[ $number =~ ^[1-9][0-9]*$ ]] || { echo "::warning::Skipping a malformed Source suggestion number."; continue; }
            comment=$(jq -r '.comment' <<< "$close")
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "$comment" \
              || echo "::warning::Could not close Source suggestion #$number."
          done
