name: Verify links

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-pause:
    runs-on: ubuntu-latest
    outputs:
      paused: ${{ steps.check.outputs.paused }}
    steps:
      - id: check
        run: |
          if [ "${{ vars.MAINTENANCE_PAUSED }}" = "true" ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Maintenance paused — skipping verification."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: check-pause
    if: needs.check-pause.outputs.paused != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # No cache: a privileged job must not restore a cache writable by less-trusted runs.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false

      - run: uv sync --frozen

      - name: Run link verifier
        run: uv run python scripts/verify_links.py

      # Always re-render: bot PRs never trigger the render gate, so this keeps README.md in sync.
      - name: Re-render guide
        run: uv run python scripts/render.py

      # Auto-merge gate lives in scripts/verify_links.py (evaluate_verify_automerge).
      # A mass quarantine (> 5 newly quarantined) or any cross-host migration holds the PR.
      - name: Evaluate auto-merge gate
        id: gate
        run: |
          # Written outside the checkout so create-pull-request never commits it.
          uv run python scripts/verify_links.py --automerge-decision > "$RUNNER_TEMP/automerge_decision.json"
          cat "$RUNNER_TEMP/automerge_decision.json"

      - name: Compute week tag and PR metadata
        id: meta
        run: |
          YEAR_WEEK=$(date -u +%Y-W%V)
          echo "YEAR_WEEK=$YEAR_WEEK" >> "$GITHUB_ENV"

          python3 - <<'EOF'
          import json, os, secrets
          from pathlib import Path

          decision = json.loads((Path(os.environ["RUNNER_TEMP"]) / "automerge_decision.json").read_text())
          auto_merge_ok = decision["auto_merge_ok"]
          report = json.loads(Path("verification_report.json").read_text())
          counts = report["counts"]

          ok_count = counts["ok"]
          dead_count = counts["dead"]
          migrated_count = counts["migrated"]

          newly_quarantined = report.get("newly_quarantined") or []
          recovered = report.get("recovered") or []
          accumulating = report.get("accumulating_dead") or []

          quarantined_count = len(newly_quarantined)
          recovered_count = len(recovered)
          accumulating_count = len(accumulating)

          top_7_count = sum(1 for q in newly_quarantined if q.get("top_7"))

          def row(r):
              code = r.get("status_code") or r.get("error", "?")
              final = r.get("final_url") or ""
              line = f"- `{r['url']}` — {code}"
              if final:
                  line += f" → `{final}`"
              return line

          def quarantine_row(q):
              flag = " 🚩 **top-7**" if q.get("top_7") else ""
              kind = q.get("kind", "resource")
              kind_tag = f" _({kind})_" if kind != "resource" else ""
              return f"- `{q['url']}` — {q['quarantine_reason']}{kind_tag}{flag} (first dead {q.get('first_dead_at') or 'today'})"

          def recovered_row(r):
              kind = r.get("kind", "resource")
              kind_tag = f" _({kind})_" if kind != "resource" else ""
              return f"- `{r['url']}`{kind_tag}"

          def accumulating_row(a):
              return f"- `{a['url']}` — first dead {a.get('first_dead_at') or '?'}"

          ok_rows = "\n".join(row(r) for r in report["ok"]) or "_none_"
          dead_rows = "\n".join(row(r) for r in report["dead"]) or "_none_"
          migrated_rows = "\n".join(row(r) for r in report["migrated"]) or "_none_"

          sections = []

          # Recoveries and top-7 quarantines no longer hold the PR; they lead the
          # body under their own headings so they can be reviewed post-hoc.
          if recovered:
              r_rows = "\n".join(recovered_row(r) for r in recovered)
              sections.append(f"## Recovered ({recovered_count})\n\n{r_rows}")

          if newly_quarantined:
              q_rows = "\n".join(quarantine_row(q) for q in newly_quarantined)
              top_7_note = f" — 🚩 {top_7_count} top-7" if top_7_count else ""
              sections.append(f"## Quarantined ({quarantined_count}){top_7_note}\n\n{q_rows}")

          if accumulating:
              a_rows = "\n".join(accumulating_row(a) for a in accumulating)
              sections.append(f"## Dead — accumulating ({accumulating_count})\n\n{a_rows}")

          sections.append(f"## Verified ✓ ({ok_count})\n\n<details>\n<summary>Expand</summary>\n\n{ok_rows}\n\n</details>")
          sections.append(f"## Dead ({dead_count})\n\n{dead_rows}")
          sections.append(f"## Migrated ({migrated_count})\n\n{migrated_rows}")

          if not auto_merge_ok:
              prefix = "> **Auto-merge skipped:** " + "; ".join(decision["reasons"]) + ".\n"
          else:
              prefix = "> **Auto-merge enabled** — this PR will land once required checks pass.\n"

          body = prefix + "\n" + "\n\n".join(sections)

          env_file = os.environ["GITHUB_ENV"]
          # Random delimiter: a body line equal to a fixed one could inject env vars (e.g. AUTO_MERGE_OK).
          delim = secrets.token_hex(16)
          with open(env_file, "a") as f:
              f.write(f"VERIFY_OK={ok_count}\n")
              f.write(f"VERIFY_DEAD={dead_count}\n")
              f.write(f"VERIFY_MIGRATED={migrated_count}\n")
              f.write(f"VERIFY_QUARANTINED={quarantined_count}\n")
              f.write(f"VERIFY_RECOVERED={recovered_count}\n")
              f.write(f"AUTO_MERGE_OK={'true' if auto_merge_ok else 'false'}\n")
              f.write(f"GATE_LABELS={','.join(['automated', 'link-health', *decision['labels']])}\n")
              f.write(f"PR_BODY<<{delim}\n")
              f.write(body + "\n")
              f.write(f"{delim}\n")
          EOF

      # Fixed branch: an open Verify PR is updated in place instead of stacking.
      - id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: bot/verify
          title: "Weekly verification ${{ env.YEAR_WEEK }} — ${{ env.VERIFY_OK }} ok / ${{ env.VERIFY_QUARANTINED }} quarantined / ${{ env.VERIFY_RECOVERED }} recovered / ${{ env.VERIFY_DEAD }} dead / ${{ env.VERIFY_MIGRATED }} migrated"
          body: ${{ env.PR_BODY }}
          commit-message: "chore(verify): weekly link verification ${{ env.YEAR_WEEK }}"
          labels: ${{ env.GATE_LABELS }}

      # The branch is fixed, so gate state can carry over from an earlier run on
      # the same PR: clear a stale hold before arming, disarm a stale arm on hold.
      - name: Enable auto-merge (gate passed)
        if: env.AUTO_MERGE_OK == 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh pr edit "$PR" --remove-label auto-merge-skipped || true
          gh pr merge "$PR" --auto --squash

      - name: Hold for review (gate failed)
        if: env.AUTO_MERGE_OK != 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        # The label also arrives via GATE_LABELS on create-pull-request; adding it
        # here too is idempotent and keeps the hold explicit beside --disable-auto.
        run: |
          gh pr edit "$PR" --add-label auto-merge-skipped || true
          gh pr merge "$PR" --disable-auto || true
